name: Amazon Price Scraper Cron

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
      SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Execute scraper
        run: node tracker.js